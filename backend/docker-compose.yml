version: '3.8'

services:
  # Database Service (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: fixsy_db
    restart: always
    environment:
      POSTGRES_USER: fixsy_admin
      POSTGRES_PASSWORD: fixsy_password_123 # Change this in production!
      POSTGRES_DB: fixsy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Database Viewer (pgAdmin) - Optional but recommended
  pgadmin:
    image: dpage/pgadmin4
    container_name: fixsy_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fixsy.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
